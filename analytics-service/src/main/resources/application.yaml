server:
  port: 8081

spring:
  application:
    name: analytics-service
  datasource:
    # WHY: env overrides let Docker/Compose point at its own Postgres without code changes
    url: jdbc:postgresql://${ANALYTICS_DB_HOST:localhost}:${ANALYTICS_DB_PORT:5434}/analytics
    username: ${ANALYTICS_DB_USER:linkpulse}
    password: ${ANALYTICS_DB_PASSWORD:linkpulse}
  flyway:
    # WHY: with Boot 4.1.2 the default location found no scripts here, so name it explicitly
    locations: classpath:db/migration
  jpa:
    hibernate:
      # WHY: Flyway owns the schema; Hibernate only checks it matches
      ddl-auto: validate
  kafka:
    # WHY: env override lets Docker/Compose point at the broker without code changes
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: analytics
      # WHY: a new group should replay the topic from the start so no click events are missed
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # WHY: ErrorHandlingDeserializer stops one malformed record from blocking the partition forever
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        "[spring.deserializer.value.delegate.class]": org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        # WHY: producer lives in another service, so don't rely on its class-name type headers
        "[spring.json.value.default.type]": com.linkpulse.analytics_service.event.ClickEvent
        "[spring.json.use.type.headers]": false
        "[spring.json.trusted.packages]": com.linkpulse.analytics_service.event

app:
  click-events:
    topic: click.events
  stats:
    # WHY: daily totals follow the India calendar day, not UTC, so late-evening clicks land on the user's date
    zone: Asia/Kolkata

management:
  endpoints:
    web:
      exposure:
        # WHY: expose only health and metrics, nothing else (env, beans...)
        include: health,metrics
