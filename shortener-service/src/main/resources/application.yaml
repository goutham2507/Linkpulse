app:
  base-url: http://localhost:8080
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-must-be-at-least-32-bytes}
    expiration-minutes: 60
  cache:
    enabled: true
    link-ttl-seconds: 3600
    negative-ttl-seconds: 60
  # raised for k6 benchmarking (setup creates 10 links per run); production: create 10/60s, login 10/60s, register 5/3600s
  rate-limit:
    create-link:
      limit: 1000
      window-seconds: 60
    login:
      limit: 1000
      window-seconds: 60
    register:
      limit: 1000
      window-seconds: 3600
spring:
  application:
    name: shortener-service
  datasource:
    url: jdbc:postgresql://localhost:5433/shortener
    username: linkpulse
    password: linkpulse
  jpa:
    hibernate:
      ddl-auto: validate
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 500ms           # fail fast so a Redis outage can't stall redirects
      connect-timeout: 500ms
management:
  endpoints:
    web:
      exposure:
        include: health,metrics   # nothing else (env, beans...) is exposed
  endpoint:
    health:
      show-details: never         # public health answers only UP/DOWN, no infrastructure details
logging:
  level:
    com.linkpulse.shortener_service.cache: DEBUG
